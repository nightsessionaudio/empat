name: Build
on: [push, workflow_dispatch]
jobs:
  mac:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - run: cmake --build build --config Release
      - run: cd build/NSAChords_artefacts/Release/VST3 && zip -r "$GITHUB_WORKSPACE/NSA-Chords-mac.zip" "NSA Chords.vst3"
      - uses: actions/upload-artifact@v4
        with:
          name: NSA-Chords-mac
          path: NSA-Chords-mac.zip
